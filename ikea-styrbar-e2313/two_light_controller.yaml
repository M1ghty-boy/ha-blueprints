blueprint:
  name: IKEA STYRBAR E2313 - Main fixture + accent lamp (Z2M)
  description: >
    Controls a main fixture ("Big Light") and an accent "Lamp" from a
    Zigbee2MQTT IKEA STYRBAR E2313 remote.


    Top button, short press: toggle the Big Light.

    Bottom button, short press: toggle the Lamp (on/off only).

    Top button, hold: brighten the Big Light until released.

    Bottom button, hold: dim the Big Light until released.

    Left arrow: shift the Big Light colour temperature warmer.

    Right arrow: shift the Big Light colour temperature cooler.


    The Big Light must support brightness and colour temperature.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/pqpxo/ha-blueprints/blob/main/IKEA%20STYRBAR%20E2313/two_light_controller.yaml
  input:
    controller_section:
      name: Controller
      icon: mdi:remote
      input:
        controller:
          name: (Zigbee2MQTT) Controller name
          description: >
            The device's friendly name as configured in Zigbee2MQTT, for example
            Office Lights Switch.
          selector:
            text:
        base_topic:
          name: (Zigbee2MQTT) Base MQTT topic
          description: The base topic configured in Zigbee2MQTT.
          default: zigbee2mqtt
          selector:
            text:

    lights_section:
      name: Lights
      icon: mdi:lightbulb-group
      input:
        big_light:
          name: Big Light
          description: >
            Main fixture. Toggled by the top button; dimmed with hold; colour
            temperature set with the arrows. Must support brightness and colour
            temperature.
          selector:
            entity:
              filter:
                domain: light
        lamp:
          name: Lamp
          description: Secondary lamp, toggled on/off by the bottom button.
          selector:
            entity:
              filter:
                domain: light

    behaviour_section:
      name: Behaviour
      icon: mdi:tune
      collapsed: true
      input:
        brightness_step:
          name: Hold brightness step
          description: Brightness change per loop iteration while holding.
          default: 10
          selector:
            number:
              min: 1
              max: 50
              step: 1
              unit_of_measurement: "%"
        step_interval:
          name: Hold step interval
          description: Delay between brightness steps while holding.
          default: 0.3
          selector:
            number:
              min: 0.1
              max: 2
              step: 0.1
              unit_of_measurement: s
        kelvin_step:
          name: Colour temperature step
          description: Change per left/right arrow press.
          default: 300
          selector:
            number:
              min: 50
              max: 1000
              step: 50
              unit_of_measurement: K
        transition:
          name: Transition
          default: 0.3
          selector:
            number:
              min: 0
              max: 5
              step: 0.1
              unit_of_measurement: s

# restart cancels a running hold loop when the release (brightness_stop) or any
# other button event arrives
mode: restart

trigger_variables:
  base_topic: !input base_topic
  controller: !input controller

triggers:
  - trigger: mqtt
    topic: "{{ base_topic ~ '/' ~ controller }}"

conditions:
  - condition: template
    value_template: "{{ trigger.payload_json.action is defined }}"

variables:
  big_light: !input big_light
  lamp: !input lamp
  step: !input brightness_step
  interval: !input step_interval
  k_step: !input kelvin_step
  tr: !input transition
  act: "{{ trigger.payload_json.action }}"

actions:
  - choose:
      # top, short press
      - conditions:
          - condition: template
            value_template: "{{ act == 'on' }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: "{{ big_light }}"
            data:
              transition: "{{ tr }}"

      # bottom, short press
      - conditions:
          - condition: template
            value_template: "{{ act == 'off' }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: "{{ lamp }}"

      # top, hold: brighten until released (a new event cancels this run)
      - conditions:
          - condition: template
            value_template: "{{ act == 'brightness_move_up' }}"
        sequence:
          - repeat:
              count: 30
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ big_light }}"
                  data:
                    brightness_step_pct: "{{ step }}"
                    transition: "{{ interval }}"
                - delay:
                    milliseconds: "{{ (interval * 1000) | int }}"

      # bottom, hold: dim until released
      - conditions:
          - condition: template
            value_template: "{{ act == 'brightness_move_down' }}"
        sequence:
          - repeat:
              count: 30
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ big_light }}"
                  data:
                    brightness_step_pct: "{{ step * -1 }}"
                    transition: "{{ interval }}"
                - delay:
                    milliseconds: "{{ (interval * 1000) | int }}"

      # left arrow: warmer (lower kelvin)
      - conditions:
          - condition: template
            value_template: "{{ act == 'arrow_left_click' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ big_light }}"
            data:
              color_temp_kelvin: >-
                {% set k = state_attr(big_light, 'color_temp_kelvin') | int(4000) %}
                {% set lo = state_attr(big_light, 'min_color_temp_kelvin') | int(2000) %}
                {{ [k - k_step, lo] | max }}
              transition: "{{ tr }}"

      # right arrow: cooler (higher kelvin)
      - conditions:
          - condition: template
            value_template: "{{ act == 'arrow_right_click' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ big_light }}"
            data:
              color_temp_kelvin: >-
                {% set k = state_attr(big_light, 'color_temp_kelvin') | int(4000) %}
                {% set hi = state_attr(big_light, 'max_color_temp_kelvin') | int(6500) %}
                {{ [k + k_step, hi] | min }}
              transition: "{{ tr }}"
