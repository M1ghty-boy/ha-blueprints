blueprint:
  name: IKEA STYRBAR E2313 - Main fixture + accent lamp (Z2M)
  description: >
    Controls a main fixture ("Big Light") and an accent "Lamp" from a
    Zigbee2MQTT IKEA STYRBAR E2313 remote. Colour is the default; white is a
    shortcut.


    Top short press: toggle the Big Light. Bottom short press: toggle the Lamp.

    Top hold: brighten the Big Light until released. Bottom hold: dim it.

    Left arrow hold: sweep the hue left. Right arrow hold: sweep the hue right.

    Left arrow, double click: default white (colour temperature only).

    Right arrow, double click / triple click / ...: colour preset 1 / 2 / ...

    Single clicks on the arrows do nothing.


    Clicks are counted inside a click window, so arrow actions fire when the
    window closes. Holds and clicks never overlap. The Big Light must support
    colour and colour temperature.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/pqpxo/ha-blueprints/blob/main/IKEA%20STYRBAR%20E2313/two_light_controller.yaml
  input:
    controller_section:
      name: Controller
      icon: mdi:remote
      input:
        controller:
          name: (Zigbee2MQTT) Controller name
          description: >
            The device's friendly name as configured in Zigbee2MQTT, for example
            Office Lights Switch.
          selector:
            text:
        base_topic:
          name: (Zigbee2MQTT) Base MQTT topic
          description: The base topic configured in Zigbee2MQTT.
          default: zigbee2mqtt
          selector:
            text:

    lights_section:
      name: Lights
      icon: mdi:lightbulb-group
      input:
        big_light:
          name: Big Light
          description: >
            Main fixture. Must support brightness, colour and colour
            temperature.
          selector:
            entity:
              filter:
                domain: light
        lamp:
          name: Lamp
          description: Secondary lamp, toggled on/off by the bottom button.
          selector:
            entity:
              filter:
                domain: light

    tuning_section:
      name: Tuning
      icon: mdi:tune
      collapsed: true
      input:
        dimming_step:
          name: Dimming step
          description: Brightness change per loop iteration while holding.
          default: 10
          selector:
            number:
              min: 1
              max: 25
              step: 1
              mode: slider
              unit_of_measurement: "%"
        dimming_transition:
          name: Dimming transition
          description: >
            Transition time, and delay between steps, while holding up/down or
            sweeping hue.
          default: 0.4
          selector:
            number:
              min: 0.1
              max: 2.0
              step: 0.1
              mode: slider
              unit_of_measurement: s
        hue_speed:
          name: Hue sweep speed
          description: >
            Degrees of hue per second while holding left/right. Commands are
            sent at most about 3 times per second, each fading over one loop
            interval (the longer of the dimming transition and 0.35 s).
          default: 60
          selector:
            number:
              min: 10
              max: 180
              step: 5
              mode: slider
              unit_of_measurement: "°/s"
        max_hold_seconds:
          name: Max hue sweep time
          description: Safety cap; the sweep also stops on release.
          default: 30
          selector:
            number:
              min: 5
              max: 120
              step: 5
              mode: slider
              unit_of_measurement: s
        click_window:
          name: Click window
          description: >
            How long to wait for further clicks on an arrow. Lower is snappier,
            higher is easier to multi-click. Arrow click actions are delayed by
            this amount.
          default: 350
          selector:
            number:
              min: 200
              max: 1000
              step: 50
              mode: slider
              unit_of_measurement: ms

    colours_section:
      name: Colours
      icon: mdi:palette
      collapsed: true
      input:
        color_temp_startup_entity:
          name: Colour temp startup entity (optional)
          description: >
            The bulb's "Color temp startup" config entity (Zigbee2MQTT's own
            spelling of the name)
            (a number, select or sensor whose name contains
            color_temp_startup). Its state is read in mireds and applied by a
            double click on the left arrow. If empty or the state is not a
            number (for example "previous"), the fallback below is used.
          default: ""
          selector:
            entity:
              filter:
                - domain: number
                - domain: select
                - domain: sensor
        default_white_mireds:
          name: Fallback white (mireds)
          description: >
            Colour temperature in mireds (not Kelvin) used when no startup
            entity is set or its state is not numeric. 333 mireds = 3000 K.
            Always clamped to the Big Light's own range.
          default: 333
          selector:
            number:
              min: 100
              max: 600
              step: 1
              mode: slider
              unit_of_measurement: mired
        colour_presets:
          name: Colour presets
          description: >
            List of up to 5 colours as [hue, saturation] pairs (hue 0-360,
            saturation 0-100). Right arrow double click selects the first, a
            triple click the second, and so on. Clicks beyond the list are
            ignored. Defaults: red, blue, green, purple, orange.
          default:
            - [0, 100]
            - [240, 100]
            - [120, 100]
            - [280, 100]
            - [30, 100]
          selector:
            object:

# single: a running click window or hold loop collects its own follow-up
# events (clicks, release) with wait_for_trigger; other events are ignored
# meanwhile.
mode: single
max_exceeded: silent

trigger_variables:
  base_topic: !input base_topic
  controller: !input controller

triggers:
  - trigger: mqtt
    topic: "{{ base_topic ~ '/' ~ controller }}"

conditions:
  - condition: template
    value_template: "{{ trigger.payload_json.action is defined }}"

variables:
  base_topic: !input base_topic
  controller: !input controller
  topic: "{{ base_topic ~ '/' ~ controller }}"
  big_light: !input big_light
  lamp: !input lamp
  dim_step: !input dimming_step
  dim_trans: !input dimming_transition
  hue_speed: !input hue_speed
  max_hold: !input max_hold_seconds
  click_window: !input click_window
  startup_entity: !input color_temp_startup_entity
  white_m: !input default_white_mireds
  presets: !input colour_presets
  act: "{{ trigger.payload_json.action }}"

actions:
  - choose:
      # top, short press
      - conditions:
          - condition: template
            value_template: "{{ act == 'on' }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: "{{ big_light }}"
            data:
              transition: "{{ dim_trans }}"

      # bottom, short press
      - conditions:
          - condition: template
            value_template: "{{ act == 'off' }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: "{{ lamp }}"

      # top / bottom hold: brighten / dim until released, max 30 steps
      - conditions:
          - condition: template
            value_template: "{{ act in ['brightness_move_up', 'brightness_move_down'] }}"
        sequence:
          - repeat:
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ big_light }}"
                  data:
                    brightness_step_pct: >-
                      {{ dim_step if act == 'brightness_move_up' else dim_step * -1 }}
                    transition: "{{ dim_trans }}"
                # the wait doubles as the step delay and the release detector
                - wait_for_trigger:
                    - trigger: mqtt
                      topic: "{{ topic }}"
                      value_template: "{{ value_json.action == 'brightness_stop' }}"
                  timeout:
                    milliseconds: "{{ (dim_trans * 1000) | int }}"
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none or repeat.index >= 30 }}"

      # left / right arrow hold: continuous hue sweep until released or
      # max_hold_seconds. Each command fades over one loop interval so the
      # fades chain. The target hue is computed from the start hue and elapsed
      # time, not read back, because the reported hue lags during a fade.
      - conditions:
          - condition: template
            value_template: "{{ act in ['arrow_left_hold', 'arrow_right_hold'] }}"
        sequence:
          - variables:
              start_hs: "{{ state_attr(big_light, 'hs_color') or [0, 100] }}"
              start_ts: "{{ now().timestamp() }}"
              # never faster than 3 commands per second
              interval: "{{ [dim_trans, 0.35] | max }}"
              direction: "{{ 1 if act == 'arrow_right_hold' else -1 }}"
          - repeat:
              sequence:
                - variables:
                    elapsed: "{{ now().timestamp() - start_ts }}"
                    new_h: >-
                      {{ (start_hs[0] + direction * hue_speed * (elapsed + interval)) % 360 }}
                - action: light.turn_on
                  target:
                    entity_id: "{{ big_light }}"
                  data:
                    hs_color:
                      - "{{ new_h }}"
                      - "{{ start_hs[1] }}"
                    transition: "{{ interval }}"
                - wait_for_trigger:
                    - trigger: mqtt
                      topic: "{{ topic }}"
                      value_template: >-
                        {{ value_json.action in ['arrow_left_release', 'arrow_right_release'] }}
                  timeout:
                    milliseconds: "{{ (interval * 1000) | int }}"
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: >-
                    {{ wait.trigger is not none
                       or now().timestamp() - start_ts >= max_hold }}

      # left / right arrow click: count clicks inside the click window
      - conditions:
          - condition: template
            value_template: "{{ act in ['arrow_left_click', 'arrow_right_click'] }}"
        sequence:
          - repeat:
              sequence:
                - wait_for_trigger:
                    - trigger: mqtt
                      topic: "{{ topic }}"
                      value_template: "{{ value_json.action == act }}"
                  timeout:
                    milliseconds: "{{ click_window | int }}"
                  continue_on_timeout: true
                # repeat.index is the number of clicks counted so far; act when
                # the window closes (or at 6 clicks)
                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is none or repeat.index >= 6 }}"
                  then:
                    - variables:
                        clicks: "{{ repeat.index }}"
                        # startup value is in mireds; non-numeric states
                        # (previous, named presets, unavailable) fall back to
                        # the configured white; result is clamped to the
                        # light's own range
                        send_k: >-
                          {% if act == 'arrow_left_click' and clicks == 2 %}
                            {% set s = states(startup_entity) if startup_entity | string | length > 0 else '' %}
                            {% set m = s | float(none) %}
                            {% if m is none or m <= 0 %}{% set m = white_m | float(333) %}{% endif %}
                            {% set lo = 1000000 / (state_attr(big_light, 'max_color_temp_kelvin') | float(6535)) %}
                            {% set hi = 1000000 / (state_attr(big_light, 'min_color_temp_kelvin') | float(2000)) %}
                            {{ (1000000 / ([[m, lo] | max, hi] | min)) | round(0) | int }}
                          {% else %}{{ none }}{% endif %}
                        send_hs: >-
                          {{ presets[clicks - 2]
                             if act == 'arrow_right_click' and clicks >= 2
                                and clicks - 2 < presets | count else none }}
                    # colour is sent as its own command with no transition and
                    # verified, as many Zigbee bulbs drop colour sent alongside
                    # other attributes (same approach as the original blueprint)
                    - if:
                        - condition: template
                          value_template: "{{ send_k is not none or send_hs is not none }}"
                      then:
                        - repeat:
                            sequence:
                              - choose:
                                  - conditions:
                                      - condition: template
                                        value_template: "{{ send_hs is not none }}"
                                    sequence:
                                      - action: light.turn_on
                                        target:
                                          entity_id: "{{ big_light }}"
                                        data:
                                          hs_color: "{{ send_hs }}"
                                default:
                                  - action: light.turn_on
                                    target:
                                      entity_id: "{{ big_light }}"
                                    data:
                                      color_temp_kelvin: "{{ send_k }}"
                              - delay:
                                  milliseconds: 700
                            until:
                              - condition: template
                                value_template: >-
                                  {% set hs = state_attr(big_light, 'hs_color') %}
                                  {% set k = state_attr(big_light, 'color_temp_kelvin') %}
                                  {{ repeat.index >= 3
                                     or (send_hs is not none and hs is not none
                                         and (((hs[0] - send_hs[0]) + 540) % 360 - 180) | abs < 5
                                         and (hs[1] - send_hs[1]) | abs < 5)
                                     or (send_k is not none and k is not none
                                         and (k - send_k) | abs < 100) }}
              until:
                - condition: template
                  value_template: "{{ wait.trigger is none or repeat.index >= 6 }}"
