blueprint:
  name: IKEA STYRBAR E2313 - Main fixture + accent lamp (Z2M)
  description: >
    Controls a main fixture ("Big Light") and an accent "Lamp" from a
    Zigbee2MQTT IKEA STYRBAR E2313 remote.


    Top button, short press: toggle the Big Light.

    Bottom button, short press: toggle the Lamp (on/off only).

    Top button, hold: brighten the Big Light until released.

    Bottom button, hold: dim the Big Light until released.

    Left arrow: shift the Big Light colour temperature warmer.

    Right arrow: shift the Big Light colour temperature cooler.


    The Big Light must support brightness and colour temperature. Hold loops
    stop on release and are capped at 30 iterations.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/pqpxo/ha-blueprints/blob/main/IKEA%20STYRBAR%20E2313/two_light_controller.yaml
  input:
    controller_section:
      name: Controller
      icon: mdi:remote
      input:
        controller:
          name: (Zigbee2MQTT) Controller name
          description: >
            The device's friendly name as configured in Zigbee2MQTT, for example
            Office Lights Switch.
          selector:
            text:
        base_topic:
          name: (Zigbee2MQTT) Base MQTT topic
          description: The base topic configured in Zigbee2MQTT.
          default: zigbee2mqtt
          selector:
            text:

    lights_section:
      name: Lights
      icon: mdi:lightbulb-group
      input:
        big_light:
          name: Big Light
          description: >
            Main fixture. Toggled by the top button; dimmed with hold; colour
            temperature set with the arrows. Must support brightness and colour
            temperature.
          selector:
            entity:
              filter:
                domain: light
        lamp:
          name: Lamp
          description: Secondary lamp, toggled on/off by the bottom button.
          selector:
            entity:
              filter:
                domain: light

    tuning_section:
      name: Tuning
      icon: mdi:tune
      collapsed: true
      input:
        dimming_step:
          name: Dimming step
          description: Brightness change per loop iteration while holding.
          default: 10
          selector:
            number:
              min: 1
              max: 25
              step: 1
              mode: slider
              unit_of_measurement: "%"
        dimming_transition:
          name: Dimming transition
          description: >
            Transition time, and delay between steps, while holding.
          default: 0.4
          selector:
            number:
              min: 0.1
              max: 2.0
              step: 0.1
              mode: slider
              unit_of_measurement: s
        kelvin_step:
          name: Colour temperature step
          description: Change per left/right arrow press.
          default: 400
          selector:
            number:
              min: 100
              max: 1200
              step: 100
              mode: slider
              unit_of_measurement: K

# restart cancels a running hold loop when the release (brightness_stop) or any
# other button event arrives
mode: restart

trigger_variables:
  base_topic: !input base_topic
  controller: !input controller

triggers:
  - trigger: mqtt
    topic: "{{ base_topic ~ '/' ~ controller }}"

conditions:
  - condition: template
    value_template: "{{ trigger.payload_json.action is defined }}"

variables:
  big_light: !input big_light
  lamp: !input lamp
  dim_step: !input dimming_step
  dim_trans: !input dimming_transition
  k_step: !input kelvin_step
  act: "{{ trigger.payload_json.action }}"

actions:
  - choose:
      # top, short press
      - conditions:
          - condition: template
            value_template: "{{ act == 'on' }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: "{{ big_light }}"
            data:
              transition: "{{ dim_trans }}"

      # bottom, short press
      - conditions:
          - condition: template
            value_template: "{{ act == 'off' }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: "{{ lamp }}"

      # top, hold: brighten until released (a new event cancels this run)
      - conditions:
          - condition: template
            value_template: "{{ act == 'brightness_move_up' }}"
        sequence:
          - repeat:
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ big_light }}"
                  data:
                    brightness_step_pct: "{{ dim_step }}"
                    transition: "{{ dim_trans }}"
                - delay:
                    milliseconds: "{{ (dim_trans * 1000) | int }}"
              until:
                - condition: template
                  value_template: "{{ repeat.index >= 30 }}"

      # bottom, hold: dim until released
      - conditions:
          - condition: template
            value_template: "{{ act == 'brightness_move_down' }}"
        sequence:
          - repeat:
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ big_light }}"
                  data:
                    brightness_step_pct: "{{ dim_step * -1 }}"
                    transition: "{{ dim_trans }}"
                - delay:
                    milliseconds: "{{ (dim_trans * 1000) | int }}"
              until:
                - condition: template
                  value_template: "{{ repeat.index >= 30 }}"

      # left arrow: warmer (lower kelvin), clamped to 2000-6500K
      - conditions:
          - condition: template
            value_template: "{{ act == 'arrow_left_click' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ big_light }}"
            data:
              color_temp_kelvin: >-
                {% set k = state_attr(big_light, 'color_temp_kelvin') | int(4000) %}
                {{ [[k - k_step, 2000] | max, 6500] | min }}
              transition: "{{ dim_trans }}"

      # right arrow: cooler (higher kelvin), clamped to 2000-6500K
      - conditions:
          - condition: template
            value_template: "{{ act == 'arrow_right_click' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ big_light }}"
            data:
              color_temp_kelvin: >-
                {% set k = state_attr(big_light, 'color_temp_kelvin') | int(4000) %}
                {{ [[k + k_step, 2000] | max, 6500] | min }}
              transition: "{{ dim_trans }}"
