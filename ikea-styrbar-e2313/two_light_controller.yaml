blueprint:
  name: IKEA STYRBAR E2313 - Main fixture + accent lamp (Z2M)
  description: >
    Controls a main fixture ("Big Light") and an accent "Lamp" from a
    Zigbee2MQTT IKEA STYRBAR E2313 remote.


    Top button, short press: toggle the Big Light.

    Bottom button, short press: toggle the Lamp (on/off only).

    Top button, hold: brighten the Big Light until released.

    Bottom button, hold: dim the Big Light until released.

    Left / right arrow: in white mode shift colour temperature warmer / cooler;
    in colour mode step the hue down / up.


    Konami code (optional, needs a helper): up, up, down, down, left, right,
    left, right as short presses switches between white and colour mode.


    The Big Light must support brightness and colour temperature. Colour mode
    needs a colour-capable Big Light. Hold loops stop on release and are
    capped at 30 iterations.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/pqpxo/ha-blueprints/blob/main/IKEA%20STYRBAR%20E2313/two_light_controller.yaml
  input:
    controller_section:
      name: Controller
      icon: mdi:remote
      input:
        controller:
          name: (Zigbee2MQTT) Controller name
          description: >
            The device's friendly name as configured in Zigbee2MQTT, for example
            Office Lights Switch.
          selector:
            text:
        base_topic:
          name: (Zigbee2MQTT) Base MQTT topic
          description: The base topic configured in Zigbee2MQTT.
          default: zigbee2mqtt
          selector:
            text:

    lights_section:
      name: Lights
      icon: mdi:lightbulb-group
      input:
        big_light:
          name: Big Light
          description: >
            Main fixture. Toggled by the top button; dimmed with hold; colour
            temperature or hue set with the arrows. Must support brightness and
            colour temperature.
          selector:
            entity:
              filter:
                domain: light
        lamp:
          name: Lamp
          description: Secondary lamp, toggled on/off by the bottom button.
          selector:
            entity:
              filter:
                domain: light

    tuning_section:
      name: Tuning
      icon: mdi:tune
      collapsed: true
      input:
        dimming_step:
          name: Dimming step
          description: Brightness change per loop iteration while holding.
          default: 10
          selector:
            number:
              min: 1
              max: 25
              step: 1
              mode: slider
              unit_of_measurement: "%"
        dimming_transition:
          name: Dimming transition
          description: >
            Transition time, and delay between steps, while holding.
          default: 0.4
          selector:
            number:
              min: 0.1
              max: 2.0
              step: 0.1
              mode: slider
              unit_of_measurement: s
        kelvin_step:
          name: Colour temperature step
          description: Change per arrow press in white mode.
          default: 400
          selector:
            number:
              min: 100
              max: 1200
              step: 100
              mode: slider
              unit_of_measurement: K
        hue_step:
          name: Hue step
          description: Hue change per arrow press in colour mode.
          default: 30
          selector:
            number:
              min: 5
              max: 90
              step: 5
              mode: slider
              unit_of_measurement: "°"

    colour_section:
      name: Colour mode and Konami code
      icon: mdi:palette
      collapsed: true
      input:
        colour_mode_helper:
          name: Colour mode helper (optional)
          description: >
            An input_boolean that stores whether colour mode is on. If left
            empty, colour mode is inferred from the Big Light itself (on while
            it is in a colour mode) and can only be switched while the light
            is on.
          default: ""
          selector:
            entity:
              filter:
                domain: input_boolean
        konami_helper:
          name: Konami code helper (optional)
          description: >
            An input_text (max length at least 30) used to track progress of
            the Konami code. If left empty the Konami code is disabled.
          default: ""
          selector:
            entity:
              filter:
                domain: input_text
        konami_timeout:
          name: Konami code timeout
          description: Maximum time allowed between presses of the code.
          default: 3
          selector:
            number:
              min: 1
              max: 10
              step: 0.5
              mode: slider
              unit_of_measurement: s

# restart cancels a running hold loop when the release (brightness_stop) or any
# other button event arrives
mode: restart

trigger_variables:
  base_topic: !input base_topic
  controller: !input controller

triggers:
  - trigger: mqtt
    topic: "{{ base_topic ~ '/' ~ controller }}"

conditions:
  - condition: template
    value_template: "{{ trigger.payload_json.action is defined }}"

variables:
  big_light: !input big_light
  lamp: !input lamp
  dim_step: !input dimming_step
  dim_trans: !input dimming_transition
  k_step: !input kelvin_step
  h_step: !input hue_step
  colour_helper: !input colour_mode_helper
  konami_helper: !input konami_helper
  konami_timeout: !input konami_timeout
  colour_modes:
    - hs
    - xy
    - rgb
    - rgbw
    - rgbww
  code:
    - "on"
    - "on"
    - "off"
    - "off"
    - arrow_left_click
    - arrow_right_click
    - arrow_left_click
    - arrow_right_click
  act: "{{ trigger.payload_json.action }}"

actions:
  # Konami progress is kept as "<presses matched>|<epoch of last press>"
  - variables:
      konami_on: "{{ konami_helper | string | length > 0 }}"
      is_press: "{{ act in code }}"
      prev: >-
        {{ (states(konami_helper) ~ '|0').split('|') if konami_helper | string | length > 0
           else ['0', '0'] }}
      prev_idx: "{{ prev[0] | int(0) }}"
      now_ts: "{{ now().timestamp() }}"
      fresh: >-
        {{ prev_idx > 0 and prev_idx < 8
           and (now_ts - (prev[1] | float(0))) <= (konami_timeout | float(3)) }}
      base_idx: "{{ prev_idx if fresh else 0 }}"
      new_idx: >-
        {{ base_idx + 1 if act == code[base_idx]
           else (1 if act == code[0] else 0) }}
      code_done: "{{ konami_on and is_press and new_idx == 8 }}"
      # computed in one expression on purpose: supported_color_modes is a list
      # of StrEnum members and does not survive being stored in a variable
      supports_colour: >-
        {{ (state_attr(big_light, 'supported_color_modes') | default([], true))
           | select('in', colour_modes) | list | count > 0 }}
      cur_colour: >-
        {{ is_state(colour_helper, 'on') if colour_helper | string | length > 0
           else state_attr(big_light, 'color_mode') in colour_modes }}
      colour_active: "{{ cur_colour and supports_colour }}"

  - if:
      - condition: template
        value_template: "{{ konami_on and is_press }}"
    then:
      - action: input_text.set_value
        target:
          entity_id: "{{ konami_helper }}"
        data:
          value: "{{ 0 if code_done else new_idx }}|{{ now_ts }}"

  - choose:
      # Konami code completed: switch between white and colour mode
      - conditions:
          - condition: template
            value_template: "{{ code_done and supports_colour }}"
        sequence:
          - variables:
              to_colour: "{{ not cur_colour }}"
              hs: "{{ state_attr(big_light, 'hs_color') or [30, 100] }}"
              kelvin: >-
                {{ [[state_attr(big_light, 'color_temp_kelvin') | int(4000), 2000] | max, 6500] | min }}
          - if:
              - condition: template
                value_template: "{{ colour_helper | string | length > 0 }}"
            then:
              - action: "{{ 'input_boolean.turn_on' if to_colour else 'input_boolean.turn_off' }}"
                target:
                  entity_id: "{{ colour_helper }}"
          - if:
              - condition: state
                entity_id: !input big_light
                state: "on"
            then:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ to_colour }}"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: "{{ big_light }}"
                        data:
                          hs_color: "{{ hs }}"
                default:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ big_light }}"
                    data:
                      color_temp_kelvin: "{{ kelvin }}"

      # Konami code with nothing to switch (no colour support): swallow it
      - conditions:
          - condition: template
            value_template: "{{ code_done }}"
        sequence: []

      # top, short press
      - conditions:
          - condition: template
            value_template: "{{ act == 'on' }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: "{{ big_light }}"
            data:
              transition: "{{ dim_trans }}"

      # bottom, short press
      - conditions:
          - condition: template
            value_template: "{{ act == 'off' }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: "{{ lamp }}"

      # top, hold: brighten until released (a new event cancels this run)
      - conditions:
          - condition: template
            value_template: "{{ act == 'brightness_move_up' }}"
        sequence:
          - repeat:
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ big_light }}"
                  data:
                    brightness_step_pct: "{{ dim_step }}"
                    transition: "{{ dim_trans }}"
                - delay:
                    milliseconds: "{{ (dim_trans * 1000) | int }}"
              until:
                - condition: template
                  value_template: "{{ repeat.index >= 30 }}"

      # bottom, hold: dim until released
      - conditions:
          - condition: template
            value_template: "{{ act == 'brightness_move_down' }}"
        sequence:
          - repeat:
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ big_light }}"
                  data:
                    brightness_step_pct: "{{ dim_step * -1 }}"
                    transition: "{{ dim_trans }}"
                - delay:
                    milliseconds: "{{ (dim_trans * 1000) | int }}"
              until:
                - condition: template
                  value_template: "{{ repeat.index >= 30 }}"

      # arrows in colour mode: step hue. Sent as its own command without a
      # transition and verified, as many Zigbee bulbs drop or mangle colour
      # sent with other attributes (same approach as the original blueprint).
      - conditions:
          - condition: template
            value_template: >-
              {{ act in ['arrow_left_click', 'arrow_right_click'] and colour_active }}
        sequence:
          - variables:
              cur_hs: "{{ state_attr(big_light, 'hs_color') or [0, 100] }}"
              new_h: >-
                {{ (cur_hs[0] + (h_step if act == 'arrow_right_click' else -h_step)) % 360 }}
              new_s: "{{ cur_hs[1] }}"
          - repeat:
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ big_light }}"
                  data:
                    hs_color:
                      - "{{ new_h }}"
                      - "{{ new_s }}"
                - delay:
                    milliseconds: 700
              until:
                - condition: template
                  value_template: >-
                    {% set hs = state_attr(big_light, 'hs_color') %}
                    {{ repeat.index >= 3
                       or (hs is not none
                           and (((hs[0] - new_h | float) + 540) % 360 - 180) | abs < 5) }}

      # left arrow, white mode: warmer (lower kelvin), clamped to 2000-6500K
      - conditions:
          - condition: template
            value_template: "{{ act == 'arrow_left_click' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ big_light }}"
            data:
              color_temp_kelvin: >-
                {% set k = state_attr(big_light, 'color_temp_kelvin') | int(4000) %}
                {{ [[k - k_step, 2000] | max, 6500] | min }}
              transition: "{{ dim_trans }}"

      # right arrow, white mode: cooler (higher kelvin), clamped to 2000-6500K
      - conditions:
          - condition: template
            value_template: "{{ act == 'arrow_right_click' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ big_light }}"
            data:
              color_temp_kelvin: >-
                {% set k = state_attr(big_light, 'color_temp_kelvin') | int(4000) %}
                {{ [[k + k_step, 2000] | max, 6500] | min }}
              transition: "{{ dim_trans }}"
